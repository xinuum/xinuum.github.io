name: Audit and deploy reviewed output

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "PROVENANCE.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "security/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-and-package:
    if: github.repository == 'xinuum/xinuum.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed output
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the public-output audit
        run: ./scripts/test-audit-public-output.sh
      - name: Audit public files and minimal provenance
        run: ./scripts/audit-public-output.sh
      - name: Package site directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    if: >-
      github.repository == 'xinuum/xinuum.github.io' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: audit-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy packaged site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
