name: Audit and deploy reviewed output

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "PROVENANCE.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "security/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-and-package:
    if: github.repository == 'xinuum/xinuum.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed output
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test the public-output audit
        run: ./scripts/test-audit-public-output.sh
      - name: Audit public files and minimal provenance
        run: ./scripts/audit-public-output.sh
      - name: Package site directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    if: >-
      github.repository == 'xinuum/xinuum.github.io' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: audit-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy packaged site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
